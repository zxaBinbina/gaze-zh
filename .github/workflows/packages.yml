name: Packages and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or commit SHA)
        required: true
        default: main
        type: string
      release_tag:
        description: Optional release tag, for example v0.5.0. Also applies when publish is false.
        required: false
        type: string
      publish:
        description: Create or update a GitHub Release with the packages
        required: true
        default: false
        type: boolean
      build_targets:
        description: Comma-separated IDs from packaging/release-targets.json, or all. Partial builds are artifact-only.
        required: true
        default: all
        type: string

concurrency:
  group: packages-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.59.0
  NFPM_VERSION: v2.48.0

jobs:
  targets:
    name: Select distribution and architecture targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout workflow target definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select targets
        id: matrix
        env:
          BUILD_TARGETS: ${{ inputs.build_targets || 'all' }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          targets = json.loads(Path('packaging/release-targets.json').read_text())
          requested = os.environ['BUILD_TARGETS']
          if requested != 'all':
              if os.environ['PUBLISH'] == 'true':
                  raise SystemExit('A release requires all targets; partial builds must use publish=false')
              selected = {value.strip() for value in requested.split(',')}
              unknown = selected - {target['id'] for target in targets}
              if unknown:
                  raise SystemExit(f'Unknown build targets: {sorted(unknown)}')
              targets = [target for target in targets if target['id'] in selected]
          if not targets:
              raise SystemExit('No build targets selected')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': targets}) + '\n')
          PY

  package:
    needs: targets
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      BUILD_REF: ${{ inputs.ref || github.ref }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up packaging host
        uses: ./.github/actions/setup-package-host
        with:
          format: ${{ matrix.format }}
          distro: ${{ matrix.distro }}
          deb-suite: ${{ matrix.deb_suite }}
          just-version: ${{ env.JUST_VERSION }}
          nfpm-version: ${{ env.NFPM_VERSION }}
          rust: "true"

      - name: Build distribution packages
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
          RUSTFLAGS: -Cdebuginfo=0
          GAZE_KCM: ${{ matrix.format == 'deb' && matrix.deb_suite == 'noble' && 'legacy' || 'plasma6' }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "$EXPECTED_ARCH" ]] || {
            echo "Runner architecture differs from target $EXPECTED_ARCH" >&2
            exit 1
          }
          version="$(sed -n 's/^version = "\([0-9][^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine a package version" >&2
            exit 1
          fi
          package_release=1
          release_ref="${INPUT_RELEASE_TAG:-$BUILD_REF}"
          release_ref="${release_ref#refs/tags/}"
          if [[ "$release_ref" == v* || -n "$INPUT_RELEASE_TAG" ]]; then
            [[ "$release_ref" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-zh(\.([1-9][0-9]*))?)?$ ]] || {
              echo "Unsupported release tag: $release_ref" >&2
              exit 1
            }
            tag_version="${BASH_REMATCH[1]}"
            package_release="${BASH_REMATCH[4]:-1}"
            [[ "$tag_version" == "$version" ]] || {
              echo "Tag version $tag_version differs from Cargo.toml version $version" >&2
              exit 1
            }
          fi
          VERSION="$version" PACKAGE_RELEASE="$package_release" just package "${{ matrix.format }}"
          find dist/packages -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.*' \) -print -exec sha256sum {} \;

      - name: Upload distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gaze-${{ matrix.id }}-packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            tag="$PUSH_TAG"
          else
            tag="$INPUT_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-zh(\.[1-9][0-9]*)?)?$ ]] || {
            echo "Release tag must look like v0.5.0 (got: $tag)" >&2
            exit 1
          }
          notes="docs/releases/$tag.md"
          [ -s "$notes" ] || {
            echo "Write Chinese release notes in $notes before publishing" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gaze-*-packages
          path: dist/packages

      - name: Bundle packages by distribution
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/bundle-release.py \
            --packages-dir dist/packages --output-dir dist/release \
            --tag "$RELEASE_TAG" --source-commit "$(git rev-parse HEAD)" \
            --build-url "$BUILD_URL"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ inputs.ref || github.sha }}
          name: Gaze 中文版 ${{ steps.tag.outputs.tag }}
          body_path: docs/releases/${{ steps.tag.outputs.tag }}.md
          generate_release_notes: false
          make_latest: true
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
